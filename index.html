<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    
    <!-- Métadonnées PWA -->
    <meta name="description" content="Application de dimensionnement télécoms - GSM, UMTS, Hertzien, Optique" />
    <meta name="keywords" content="télécoms, dimensionnement, GSM, UMTS, hertzien, optique, simulation" />
    <meta name="author" content="Télécoms Dimensionnement" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Télécoms" />
    
    <!-- Icônes PWA -->
    <link rel="apple-touch-icon" href="/vite.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/vite.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/vite.svg" />
    
    <!-- Préchargement des polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Optimisations mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <title>Télécoms Dimensionnement</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      console.log('CSS chargé :', getComputedStyle(document.body).fontFamily);
      
      // Enregistrer le Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker enregistré avec succès:', registration.scope);
            })
            .catch((error) => {
              console.log('Échec de l\'enregistrement du Service Worker:', error);
            });
        });
      }
      
      // Optimisation du chargement
      if ('requestIdleCallback' in window) {
        requestIdleCallback(() => {
          // Précharger les ressources non critiques
          const preloadLinks = [
            '/workers/calculations.js'
          ];
          
          preloadLinks.forEach(href => {
            const link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = href;
            document.head.appendChild(link);
          });
        });
      }
    </script>
  </body>
</html>
